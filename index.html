<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>命の砂時計</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b14; color: #c8c6d6; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  canvas { image-rendering: pixelated; display: block; }
  #keys { color: #9a98b0; }
  #keys b { color: #ffe066; font-weight: 600; }
  /* スマホ: 画面いっぱい。左半分をなぞって歩く、右半分でジャンプ */
  #touchui { display: none; }
  body.touch { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body.touch #keys { display: none; }
  body.touch #touchui { display: block; }
  #touchui button { position: fixed; top: 8px; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #ffffff40; background: #0d0b1460; color: #ffffffc0; font-size: 20px; z-index: 2; }
  #retry { right: 60px; } #back { right: 8px; }
  /* スティックとジャンプのボタン（置き場所は main.js の layoutPad。gunzo と同じく、縦持ちは下の余白、横持ちは左右の帯） */
  #stick, #jumpbtn { position: fixed; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); }
  #stick { width: 96px; height: 96px; border: 2px solid #ffffff38; background: #ffffff0c; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #ffffff40; }
  #jumpbtn { width: 84px; height: 84px; border: 2px solid #ffe06670; background: #ffe0661a; color: #ffe066c0; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  #jumpbtn.on { background: #ffe06660; color: #fff; }
  #touchui.overlay #stick, #touchui.overlay #jumpbtn { opacity: 0.5; }
</style>
</head>
<body>
<div id="game">
  <div id="keys"><b>←→</b> 歩く　<b>Z</b>・<b>X</b>・<b>Space</b> 跳ぶ（長押しで高く）　<b>R</b> 赤ちゃんからやり直す　<b>Esc</b> タイトル　ゲームパッドも可</div>
  <canvas id="c" width="320" height="240"></canvas>
</div>
<div id="touchui">
  <button id="retry" aria-label="赤ちゃんからやり直す">↺</button>
  <button id="back" aria-label="タイトル">✕</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="jumpbtn">ジャンプ</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
